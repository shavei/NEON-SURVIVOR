<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="NEON SURVIVOR — survive the swarm">
  <!-- Social share card (1200x630). Rasterized to og-image.png. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#15162b"/>
      <stop offset="1" stop-color="#07070e"/>
    </radialGradient>
    <linearGradient id="ring" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="0.55" stop-color="#c86bff"/>
      <stop offset="1" stop-color="#9b6dff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#c9fff0"/>
      <stop offset="0.45" stop-color="#54e6b5"/>
      <stop offset="1" stop-color="#17b98c"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#54e6b5"/>
      <stop offset="0.5" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tglow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint arena grid -->
  <g stroke="#54e6b5" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>
  <!-- swarm specks -->
  <g fill="#ff5fa2" opacity="0.5">
    <circle cx="90" cy="120" r="4"/><circle cx="1120" cy="500" r="5"/><circle cx="1050" cy="120" r="3"/>
    <circle cx="150" cy="520" r="3"/><circle cx="1010" cy="330" r="4"/><circle cx="70" cy="330" r="3"/>
  </g>

  <!-- mark, left -->
  <g transform="translate(120 155) scale(0.62)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#ff5fa2" stroke-width="26"
            stroke-linecap="round" stroke-dasharray="175 60.62"
            transform="rotate(45 256 256)" opacity="0.35" filter="url(#softglow)"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="26"
            stroke-linecap="round" stroke-dasharray="175 60.62"
            transform="rotate(45 256 256)" filter="url(#glow)"/>
    <g stroke="#54e6b5" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
      <line x1="256" y1="122" x2="256" y2="152"/>
      <line x1="256" y1="390" x2="256" y2="360"/>
      <line x1="390" y1="256" x2="360" y2="256"/>
      <line x1="122" y1="256" x2="152" y2="256"/>
    </g>
    <g filter="url(#glow)">
      <path d="M256 190 L322 256 L256 322 L190 256 Z" fill="url(#core)"/>
      <path d="M256 224 L288 256 L256 288 L224 256 Z" fill="#eafff9" opacity="0.9"/>
    </g>
  </g>

  <!-- wordmark + tagline, right -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
     fill="url(#word)" filter="url(#tglow)" letter-spacing="4">
    <text x="470" y="285" font-size="118">NEON</text>
    <text x="470" y="405" font-size="118">SURVIVOR</text>
  </g>
  <text x="474" y="468" font-family="'Courier New',monospace" font-size="23" fill="#8a90b8"
        letter-spacing="1">Survive the swarm · level up · beat the bosses</text>
  <text x="474" y="516" font-family="'Courier New',monospace" font-size="24" fill="#54e6b5"
        letter-spacing="3" font-weight="700">neon-survivor.com</text>
</svg>
