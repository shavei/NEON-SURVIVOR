<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NEON SURVIVOR">
  <!-- App-icon lockup: the mark on a dark neon tile. Source for favicon + PWA "any" icons. -->
  <defs>
    <linearGradient id="ring" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="0.55" stop-color="#c86bff"/>
      <stop offset="1" stop-color="#9b6dff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#c9fff0"/>
      <stop offset="0.45" stop-color="#54e6b5"/>
      <stop offset="1" stop-color="#17b98c"/>
    </radialGradient>
    <radialGradient id="tile" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#131426"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <circle cx="256" cy="256" r="150" fill="none" stroke="#ff5fa2" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="175 60.62"
          transform="rotate(45 256 256)" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="175 60.62"
          transform="rotate(45 256 256)" filter="url(#glow)"/>
  <g stroke="#54e6b5" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="122" x2="256" y2="152"/>
    <line x1="256" y1="390" x2="256" y2="360"/>
    <line x1="390" y1="256" x2="360" y2="256"/>
    <line x1="122" y1="256" x2="152" y2="256"/>
  </g>
  <g filter="url(#glow)">
    <path d="M256 190 L322 256 L256 322 L190 256 Z" fill="url(#core)"/>
    <path d="M256 224 L288 256 L256 288 L224 256 Z" fill="#eafff9" opacity="0.9"/>
  </g>
</svg>
